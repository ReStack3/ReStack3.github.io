              <div class="markdown-body">
                
                <h3 id="脚本结构"><a href="#脚本结构" class="headerlink" title="脚本结构"></a>脚本结构</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-meta">#!/bin/bash                    # Shebang，指定解释器</span><br><span class="hljs-comment"># 这是注释</span><br><span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;Hello World&quot;</span>             <span class="hljs-comment"># 输出</span><br><span class="hljs-built_in">exit</span> 0                         <span class="hljs-comment"># 返回码</span><br></code></pre></td></tr></table></figure>

<h3 id="变量"><a href="#变量" class="headerlink" title="变量"></a>变量</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-comment"># 定义（等号两边不能有空格）</span><br>name=<span class="hljs-string">&quot;张三&quot;</span><br>age=25<br><br><span class="hljs-comment"># 使用</span><br><span class="hljs-built_in">echo</span> <span class="hljs-variable">$name</span><br><span class="hljs-built_in">echo</span> <span class="hljs-variable">$&#123;name&#125;</span>                   <span class="hljs-comment"># 推荐大括号，便于拼接</span><br><span class="hljs-built_in">readonly</span> PI=3.14               <span class="hljs-comment"># 只读变量</span><br><span class="hljs-built_in">unset</span> age                      <span class="hljs-comment"># 删除变量</span><br></code></pre></td></tr></table></figure>

<h3 id="特殊变量"><a href="#特殊变量" class="headerlink" title="特殊变量"></a>特殊变量</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-variable">$0</span>      <span class="hljs-comment"># 脚本本身名称</span><br><span class="hljs-variable">$1</span>-<span class="hljs-variable">$9</span>   <span class="hljs-comment"># 第1-9个参数</span><br><span class="hljs-variable">$#</span>      <span class="hljs-comment"># 参数个数</span><br><span class="hljs-variable">$@</span>      <span class="hljs-comment"># 所有参数（分开）</span><br>$*      <span class="hljs-comment"># 所有参数（合并）</span><br>$?      <span class="hljs-comment"># 上一条命令的退出状态（0成功）</span><br>$$      <span class="hljs-comment"># 当前进程PID</span><br></code></pre></td></tr></table></figure>

<h3 id="条件判断"><a href="#条件判断" class="headerlink" title="条件判断"></a>条件判断</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-comment"># if结构</span><br><span class="hljs-keyword">if</span> [ condition ]; <span class="hljs-keyword">then</span><br>    commands<br><span class="hljs-keyword">elif</span> [ condition ]; <span class="hljs-keyword">then</span><br>    commands<br><span class="hljs-keyword">else</span><br>    commands<br><span class="hljs-keyword">fi</span><br><br><span class="hljs-comment"># 常用测试</span><br>[ -f file ]    <span class="hljs-comment"># 是否为普通文件</span><br>[ -d <span class="hljs-built_in">dir</span> ]     <span class="hljs-comment"># 是否为目录</span><br>[ -z <span class="hljs-string">&quot;<span class="hljs-variable">$var</span>&quot;</span> ]  <span class="hljs-comment"># 字符串是否为空</span><br>[ <span class="hljs-string">&quot;<span class="hljs-variable">$a</span>&quot;</span> = <span class="hljs-string">&quot;<span class="hljs-variable">$b</span>&quot;</span> ] <span class="hljs-comment"># 字符串相等</span><br>[ <span class="hljs-variable">$num</span> -eq 10 ] <span class="hljs-comment"># 数字等于（-ne 不等，-gt 大于，-lt 小于）</span><br></code></pre></td></tr></table></figure>

<h3 id="循环"><a href="#循环" class="headerlink" title="循环"></a>循环</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-comment"># for循环</span><br><span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> &#123;1..5&#125;; <span class="hljs-keyword">do</span><br>    <span class="hljs-built_in">echo</span> <span class="hljs-variable">$i</span><br><span class="hljs-keyword">done</span><br><br><span class="hljs-keyword">for</span> file <span class="hljs-keyword">in</span> *.txt; <span class="hljs-keyword">do</span><br>    <span class="hljs-built_in">echo</span> <span class="hljs-variable">$file</span><br><span class="hljs-keyword">done</span><br><br><span class="hljs-comment"># while循环</span><br>count=0<br><span class="hljs-keyword">while</span> [ <span class="hljs-variable">$count</span> -lt 5 ]; <span class="hljs-keyword">do</span><br>    <span class="hljs-built_in">echo</span> <span class="hljs-variable">$count</span><br>    ((count++))<br><span class="hljs-keyword">done</span><br></code></pre></td></tr></table></figure>

<h3 id="函数"><a href="#函数" class="headerlink" title="函数"></a>函数</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-function"><span class="hljs-title">function_name</span></span>() &#123;<br>    <span class="hljs-built_in">local</span> var=<span class="hljs-string">&quot;局部变量&quot;</span>      <span class="hljs-comment"># local声明局部变量</span><br>    <span class="hljs-built_in">echo</span> <span class="hljs-variable">$1</span>                   <span class="hljs-comment"># 函数参数</span><br>    <span class="hljs-built_in">return</span> 0<br>&#125;<br><br><span class="hljs-comment"># 调用</span><br>function_name <span class="hljs-string">&quot;参数&quot;</span><br></code></pre></td></tr></table></figure>

<h3 id="常用写法"><a href="#常用写法" class="headerlink" title="常用写法"></a>常用写法</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="code"><pre><code class="hljs bash"><span class="hljs-comment"># 命令替换</span><br>current_date=$(<span class="hljs-built_in">date</span> +%Y-%m-%d)<br><span class="hljs-comment"># 旧写法：`date +%Y-%m-%d`</span><br><br><span class="hljs-comment"># 逻辑运算</span><br>command1 &amp;&amp; command2          <span class="hljs-comment"># 前面成功才执行后面</span><br>command1 || command2          <span class="hljs-comment"># 前面失败才执行后面</span><br><br><span class="hljs-comment"># 重定向</span><br><span class="hljs-built_in">command</span> &gt; file                <span class="hljs-comment"># 覆盖写入</span><br><span class="hljs-built_in">command</span> &gt;&gt; file               <span class="hljs-comment"># 追加写入</span><br><span class="hljs-built_in">command</span> 2&gt;&amp;1                  <span class="hljs-comment"># 错误输出重定向到标准输出</span><br></code></pre></td></tr></table></figure>

<script>
  Fluid.utils.createScript('https://lib.baomitu.com/tocbot/4.20.1/tocbot.min.js', function() {
    var toc = jQuery('#toc');
    if (toc.length === 0 || !window.tocbot) { return; }
    var boardCtn = jQuery('#board-ctn');
    var boardTop = boardCtn.offset().top;

    window.tocbot.init(Object.assign({
      tocSelector     : '#toc-body',
      contentSelector : '.markdown-body',
      linkClass       : 'tocbot-link',
      activeLinkClass : 'tocbot-active-link',
      listClass       : 'tocbot-list',
      isCollapsedClass: 'tocbot-is-collapsed',
      collapsibleClass: 'tocbot-is-collapsible',
      scrollSmooth    : true,
      includeTitleTags: true,
      headingsOffset  : -boardTop,
    }, CONFIG.toc));
    if (toc.find('.toc-list-item').length > 0) {
      toc.css('visibility', 'visible');
    }

    Fluid.events.registerRefreshCallback(function() {
      if ('tocbot' in window) {
        tocbot.refresh();
        var toc = jQuery('#toc');
        if (toc.length === 0 || !tocbot) {
          return;
        }
        if (toc.find('.toc-list-item').length > 0) {
          toc.css('visibility', 'visible');
        }
      }
    });
  });
</script>

<script>
  Fluid.utils.createScript('https://lib.baomitu.com/anchor-js/4.3.1/anchor.min.js', function() {
    window.anchors.options = {
      placement: CONFIG.anchorjs.placement,
      visible  : CONFIG.anchorjs.visible
    };
    if (CONFIG.anchorjs.icon) {
      window.anchors.options.icon = CONFIG.anchorjs.icon;
    }
    var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
    var res = [];
    for (var item of el) {
      res.push('.markdown-body > ' + item.trim());
    }
    if (CONFIG.anchorjs.placement === 'left') {
      window.anchors.options.class = 'anchorjs-link-left';
    }
    window.anchors.add(res.join(', '));

    Fluid.events.registerRefreshCallback(function() {
      if ('anchors' in window) {
        anchors.removeAll();
        var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
        var res = [];
        for (var item of el) {
          res.push('.markdown-body > ' + item.trim());
        }
        if (CONFIG.anchorjs.placement === 'left') {
          anchors.options.class = 'anchorjs-link-left';
        }
        anchors.add(res.join(', '));
      }
    });
  });
</script>
